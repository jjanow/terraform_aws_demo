name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "src/**"

# Prevent concurrent plan runs against the same branch; cancel stale runs.
concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Format check ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  # ── Job 2: Security scans ────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: .
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898 # v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # GITHUB_TOKEN lets Checkov annotate the PR with findings.
          api-key: ${{ secrets.BC_API_KEY }}

  # ── Job 3: Terraform plan (dev) ──────────────────────────────────────────────
  plan-dev:
    name: Plan (dev)
    runs-on: ubuntu-latest
    needs: [lint, security-scan]

    permissions:
      id-token: write    # required for OIDC credential exchange
      contents: read
      pull-requests: write  # required to post the plan comment

    env:
      TF_IN_AUTOMATION: "true"
      TF_CLI_ARGS: "-no-color"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.5"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Plan-${{ github.run_id }}

      # The backend.tf files contain a bucket placeholder (ACCOUNT_ID).
      # TF_STATE_BUCKET secret holds the real bucket name created by bootstrap/.
      # The -backend-config flag merges with the file and takes precedence on
      # the bucket field; key, region, dynamodb_table, and encrypt come from
      # the file as-is.
      - name: Terraform Init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -o pipefail
          terraform plan -out=tfplan 2>&1 | tee plan-output.txt

      # Run even when the plan step fails so broken plans produce a comment.
      - name: Post Plan as PR Comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('environments/dev/plan-output.txt', 'utf8');

            // Truncate to stay under the 65 536-char GitHub comment limit.
            const maxLen = 60000;
            const output = raw.length > maxLen
              ? raw.slice(0, maxLen) + '\n\n…(output truncated — download the artifact for the full plan)'
              : raw;

            const marker = '<!-- terraform-plan-dev -->';
            const body = [
              marker,
              '## Terraform Plan — `dev`',
              '',
              `**Workflow run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
